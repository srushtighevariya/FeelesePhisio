/* ================= AUTHENTICATION HANDLERS ================= */
function handleLoginSubmit(event) {
  event.preventDefault();
  authError = "";
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  // 1. Check Admin Credentials
  if (username.toLowerCase() === adminAccount.username && password === adminAccount.password) {
    isLoggedIn = true;
    currentUser = {
      role: "admin",
      name: adminAccount.name,
      username: adminAccount.username,
      email: adminAccount.email
    };
    currentView = "dashboard";
    renderApp();
    return;
  }

  // 2. Check Therapist Credentials
  const matchedDoctor = doctors.find(d => 
    (d.username && d.username.toLowerCase() === username.toLowerCase() && d.password === password) ||
    (d.email && d.email.toLowerCase() === username.toLowerCase() && d.password === password)
  );

  if (matchedDoctor) {
    isLoggedIn = true;
    currentUser = {
      role: "therapist",
      doctorId: matchedDoctor.id,
      name: matchedDoctor.name,
      username: matchedDoctor.username,
      email: matchedDoctor.email,
      specialization: matchedDoctor.specialization
    };
    currentView = "dashboard";
    renderApp();
    return;
  }

  // 3. Failed Authentication
  authError = "Invalid Login ID or Password. Please check your credentials or contact clinic administrator.";
  renderApp();
}

function handleLogout() {
  isLoggedIn = false;
  currentUser = null;
  authError = "";
  renderApp();
}

/* ================= NAVIGATION ================= */
function navigate(view, param = null) {
  currentView = view;
  if (param) selectedPatientId = param;
  renderApp();
}

/* ================= RENDERING APP ================= */

  const viewport = document.getElementById('app-viewport');
  if (!isLoggedIn || !currentUser) {
    viewport.innerHTML = renderLoginScreen();

  }
}

                        <button class="btn btn-ghost btn-sm" style="color: #EF4444;" onclick="cancelAppt(${a.id})">✕</button>
                      ` : `
                        <span style="font-size: 12px; color: #94A3B8;">Completed</span>
                      `}
                    </td>
                  </tr>
                `;
              }).join("")}
              ${todaysAppts.length === 0 ? `
                <tr>
                  <td colspan="6" style="text-align: center; color: #94A3B8; padding: 24px;">No appointments scheduled for today.</td>
                </tr>
              ` : ''}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

              ${scoped.length === 0 ? `

                  const y = 145 - (s.painAfter / 10) * 125;

                stroke-linejoin="round"
                points="${patient.sessions.map((s, i) => {

              <div class="font-display" style="font-size: 22px; font-weight: 800; color: #047857; margin-top: 2px;">

              </div>
              <div style="font-size: 11px; color: #059669; margin-top: 2px;">
                ${Math.round((Math.max(0, patient.sessions[0].painBefore - patient.sessions[patient.sessions.length - 1].painAfter) / patient.sessions[0].painBefore) * 100)}% Pain Modulated
              </div>
            </div>
          </div>
        ` : `
          <div style="padding: 32px; text-align: center; color: #94A3B8; font-size: 13px;">

        </div>

        <div>
          ${patient.sessions.map((s, idx) => {
            const delta = s.painBefore - s.painAfter;
            return `
              <div style="padding: 16px 20px; border-bottom: 1px solid #F1F5F9; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
                <div style="flex: 1;">
                  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                    <span style="font-weight: 800; color: #0F172A; font-size: 13.5px;">Session #${idx + 1}</span>
                    <span class="font-mono" style="font-size: 11.5px; color: #64748B; background: #F1F5F9; padding: 2px 6px; border-radius: 4px;">${s.date}</span>
                    <span style="font-size: 11px; color: #0D9488; font-weight: 700;">⏱ ${s.duration} mins</span>
                  </div>
                  <div style="font-size: 13px; color: #334155; margin-bottom: 4px;"><b>Therapy Given:</b> ${s.treatmentGiven}</div>
                  <div style="font-size: 12px; color: #64748B; background: #F8FAFC; padding: 8px 12px; border-radius: 8px; border: 1px solid #E2E8F0;">

                  </div>
                </div>

                <div style="text-align: right; flex-shrink: 0;">
                  <div style="font-size: 11.5px; font-weight: 700; color: #64748B; margin-bottom: 4px;">Pain Response</div>
                  <div style="font-size: 13px; font-weight: 700;">
                    <span style="color: #EF4444;">${s.painBefore}/10</span> → <span style="color: #10B981;">${s.painAfter}/10</span>
                  </div>
                  <div style="font-size: 11px; color: #0D9488; font-weight: 700; margin-top: 2px;">
                    ${delta > 0 ? `↓ ${delta} pts relief` : 'Stable'}
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    </div>
  `;
}

function renderReports() {
  const isAdmin = currentUser.role === "admin";

  const reliefPoints = Math.max(0, initialPain - currentPain);
  const pctRelief = initialPain > 0 ? Math.round((reliefPoints / initialPain) * 100) : 0;
  const doneSessions = p?.sessions?.length || 0;

          <div>
            <h2 class="font-display" style="font-size: 20px; font-weight: 800; color: #0F172A;">SUNRISE PHYSIOTHERAPY & REHAB</h2>
            <p style="font-size: 11.5px; color: #64748B;">402 Sunrise Medical Hub, Vastrapur Ring Road, Surat · +91 261 400 1122</p>
          </div>
          <div style="text-align: right;">

          </div>
        </div>

        <div style="margin-bottom: 20px; padding: 14px; background: #F8FAFC; border-radius: 10px; border: 1px solid #E2E8F0;">
          <div class="grid-2" style="font-size: 13px; gap: 10px;">

          </div>

  if (painEl) clinicSettings.painScaleType = painEl.value;

  if (reEvalEl) clinicSettings.reEvaluationCycle = reEvalEl.value;

  // Security
  const timeoutEl = document.getElementById('set-timeout');
  if (timeoutEl) clinicSettings.sessionTimeout = timeoutEl.value;

  // Billing
  const fee1El = document.getElementById('set-fee-consult');
  if (fee1El) clinicSettings.consultationFee = Number(fee1El.value) || 1000;
  const fee2El = document.getElementById('set-fee-followup');

  const gstNumEl = document.getElementById('set-gst-num');
  if (gstNumEl) clinicSettings.gstNumber = gstNumEl.value;
  const gstRateEl = document.getElementById('set-gst-rate');
  if (gstRateEl) clinicSettings.gstRate = Number(gstRateEl.value) || 18;
  const noteEl = document.getElementById('set-inv-note');
  if (noteEl) clinicSettings.invoiceNote = noteEl.value;

  settingsToast = "✓ Clinic settings and security parameters have been saved successfully!";
  renderApp();

  setTimeout(() => {
    settingsToast = "";
    const toastEl = document.getElementById('settings-toast-banner');
    if (toastEl) toastEl.style.display = 'none';
  }, 4000);
}

function exportClinicData(type) {
  const exportPayload = {
    exportedAt: new Date().toISOString(),
    clinicProfile: clinicSettings,
    totalDoctors: doctors.length,
    totalPatients: patients.length,
    totalAppointments: appointments.length,
    doctors: doctors.map(d => ({ code: d.code, name: d.name, specialization: d.specialization, phone: d.phone, status: d.status })),
    patients: patients.map(p => ({ code: p.code, name: p.name, age: p.age, gender: p.gender, condition: p.assessment?.bodyPart, sessionsCount: p.sessions.length, status: p.status }))
  };

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `RecoveryPath_Clinic_Backup_${today}.${type === 'csv' ? 'csv' : 'json'}`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();

  alert(`Clinical database snapshot successfully downloaded as ${type.toUpperCase()}!`);
}

function handleGlobalSearch(query) {
  if (query.trim().length > 1) {
    const match = patients.find(p => p.name.toLowerCase().includes(query.toLowerCase()));
    if (match) {
      navigate('patient-detail', match.id);
    }
  }
}

// Initial App Mount
renderApp();
</script>
